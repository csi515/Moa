# Moa Academy — CI/CD (단일 workflow)
# Node.js 22 (.nvmrc / package.json engines) · Vite · React · TypeScript · npm
# 트리거: main push, pull_request
#
#   quality (lint + business-invariants + BI 밖 extras)
#     ├─ build-e2e          production Vite + Playwright
#     └─ security-db        ENABLE_SECURITY_AUDIT=true — live RLS/auth/DB
#   deploy ← needs quality + build-e2e + security-db
#            main + ENABLE_VERCEL_DEPLOY + ENABLE_SECURITY_AUDIT
#            security-db 실패/main secret 누락 → deploy 차단
#
# Quality는 Vite build를 하지 않는다. production build는 build-e2e.
# BI catalog에 있는 script는 quality에서 다시 개별 실행하지 않는다.
# continue-on-error 없음.
#
# 비밀값은 워크플로우에 하드코딩하지 않는다.
# GitHub → Settings → Secrets and variables → Actions

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 ref에 연속 push/PR 동기화 시 이전 실행을 취소해 billed minutes를 줄인다.
concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────
  # Quality: static + P20 BI runner + catalog 밖 extras
  # Vite build 없음. finance/commerce/attendance 등은 BI가 실행.
  # ─────────────────────────────────────────────
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CI structure
        run: node scripts/check-ci-workflow-structure.mjs --self-test

      - name: Static — lint
        run: npm run lint

      - name: Business invariants
        run: npm run test:business-invariants

      # ── BI catalog에 없는 extras (coverage 유지) ─────────────────
      - name: Extra — bulk-import
        run: npm run test:bulk-import

      - name: Extra — deeplink
        run: npm run test:deeplink

      - name: Extra — timetable-placement
        run: npm run test:timetable-placement

      - name: Extra — today-lesson-teacher
        run: npm run test:today-lesson-teacher

      - name: Extra — manual-attendance-class
        run: npm run test:manual-attendance-class

      - name: Extra — textbook-core-sale-link
        run: npm run test:textbook-core-sale-link

      - name: Extra — skin-retail-migrate
        run: npm run test:skin-retail-migrate

      - name: Extra — local-date
        run: npm run test:local-date

      - name: Extra — consultation-today
        run: npm run test:consultation-today

      - name: Extra — piano-expected-attendance
        run: npm run test:piano-expected-attendance

      - name: Extra — lesson-homework-sync
        run: npm run test:lesson-homework-sync

      - name: Extra — sync-persist-helpers
        run: npm run test:sync-persist-helpers

      - name: Extra — commerce-barrel
        run: npm run test:commerce-barrel

      - name: Extra — commerce-revenue
        run: npm run test:commerce-revenue

      - name: Extra — commerce-store-capability
        run: npm run test:commerce-store-capability

      - name: Extra — retail-revenue
        run: npm run test:retail-revenue

      # ── BI에 없는 static security (secrets 불필요) ───────────────
      - name: Static security — rls-member-scope-harden
        run: npm run test:rls-member-scope-harden

      - name: Static security — retail-staff-sale-perm
        run: npm run test:retail-staff-sale-perm

  # ─────────────────────────────────────────────
  # 빌드 + Playwright E2E
  # ─────────────────────────────────────────────
  build-e2e:
    name: Build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
      VITE_APP_SHORT_NAME: ${{ vars.VITE_APP_SHORT_NAME }}
      VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
      VITE_LEGAL_ENTITY_NAME: ${{ vars.VITE_LEGAL_ENTITY_NAME }}
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required build secrets
        run: |
          missing=0
          for key in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_APP_URL; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Register VITE_SUPABASE_URL (or SUPABASE_URL), VITE_SUPABASE_ANON_KEY (or SUPABASE_ANON_KEY), VITE_APP_URL"
            exit 1
          fi
          echo "Required VITE_* secrets are present (values not logged)."

      - name: Production build
        run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-chromium-webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Playwright E2E
        run: npm run test:e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ORG_NAME: ${{ secrets.E2E_ORG_NAME }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 2) DB security audits (Supabase 연결·JWT 시드)
  # Repository variable ENABLE_SECURITY_AUDIT=true 일 때 실행
  # continue-on-error 없음 — 실패 시 job FAIL → merge/deploy 차단
  # PR에서 audit secrets 없으면 스킵(정적 보안은 quality에서 이미 통과)
  # main push에서는 secrets 필수 (배포 게이트)
  # ─────────────────────────────────────────────
  security-db:
    name: Security DB Audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    if: vars.ENABLE_SECURITY_AUDIT == 'true'
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      RLS_AUDIT_ORG_A_ID: ${{ secrets.RLS_AUDIT_ORG_A_ID }}
      RLS_AUDIT_ORG_B_ID: ${{ secrets.RLS_AUDIT_ORG_B_ID }}
      RLS_AUDIT_STAFF_A_JWT: ${{ secrets.RLS_AUDIT_STAFF_A_JWT }}
      RLS_AUDIT_OWNER_A_JWT: ${{ secrets.RLS_AUDIT_OWNER_A_JWT }}
      RLS_AUDIT_PARENT_JWT: ${{ secrets.RLS_AUDIT_PARENT_JWT }}
      RLS_AUDIT_ATTACKER_JWT: ${{ secrets.RLS_AUDIT_ATTACKER_JWT }}
      RLS_AUDIT_CUSTOMER_JWT: ${{ secrets.RLS_AUDIT_CUSTOMER_JWT }}
      RLS_AUDIT_FOREIGN_CUSTOMER_ID: ${{ secrets.RLS_AUDIT_FOREIGN_CUSTOMER_ID }}
      RLS_AUDIT_STAFF_USER_ID: ${{ secrets.RLS_AUDIT_STAFF_USER_ID }}
      AUTH_HIJACK_USER_B_JWT: ${{ secrets.AUTH_HIJACK_USER_B_JWT }}
      AUTH_HIJACK_PROVIDER_USER_ID: ${{ secrets.AUTH_HIJACK_PROVIDER_USER_ID }}
      AUTH_HIJACK_USER_A_ID: ${{ secrets.AUTH_HIJACK_USER_A_ID }}
      AUTH_HIJACK_PROVIDER: ${{ secrets.AUTH_HIJACK_PROVIDER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect DB audit secrets
        id: audit_secrets
        run: |
          # 값은 출력하지 않음 — 존재 여부만
          required_ok=1
          for key in \
            VITE_SUPABASE_URL \
            VITE_SUPABASE_ANON_KEY \
            RLS_AUDIT_ORG_A_ID \
            RLS_AUDIT_ORG_B_ID \
            RLS_AUDIT_STAFF_A_JWT \
            RLS_AUDIT_OWNER_A_JWT \
            RLS_AUDIT_PARENT_JWT
          do
            if [ -z "${!key}" ]; then
              echo "missing_name=$key"
              required_ok=0
            fi
          done
          # membership escalation: attacker JWT (전용 또는 staff JWT 재사용)
          if [ -z "$RLS_AUDIT_ATTACKER_JWT" ] && [ -z "$RLS_AUDIT_STAFF_A_JWT" ]; then
            echo "missing_name=RLS_AUDIT_ATTACKER_JWT_or_STAFF_A_JWT"
            required_ok=0
          fi
          # auth hijack
          for key in AUTH_HIJACK_USER_B_JWT AUTH_HIJACK_PROVIDER_USER_ID; do
            if [ -z "${!key}" ]; then
              echo "missing_name=$key"
              required_ok=0
            fi
          done
          if [ "$required_ok" -eq 1 ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "DB audit secrets are present (values not logged)."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "One or more DB audit secrets are unset."
          fi

      - name: Require secrets on main (deploy gate)
        if: >
          steps.audit_secrets.outputs.has_secrets != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          echo "::error::ENABLE_SECURITY_AUDIT=true on main but DB audit secrets are missing."
          echo "Configure RLS_AUDIT_* and AUTH_HIJACK_* in Actions secrets (do not commit values)."
          exit 1

      - name: Skip DB audits on PR without secrets
        if: >
          steps.audit_secrets.outputs.has_secrets != 'true' &&
          !(github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          echo "DB security audits were not executed (secrets unavailable on this PR)."
          echo "This job success is not a DB-audit PASS."
          echo "Static security already ran in quality. main push fails if secrets are missing."

      - name: RLS org isolation audit
        if: steps.audit_secrets.outputs.has_secrets == 'true'
        run: npm run test:rls-audit

      - name: Atomic booking + session pass DB IT
        if: steps.audit_secrets.outputs.has_secrets == 'true'
        run: npm run test:booking-pass-atomic-db

      - name: Membership escalation audit
        if: steps.audit_secrets.outputs.has_secrets == 'true'
        run: npm run test:rls-membership-escalation

      - name: Auth providers hijack audit
        if: steps.audit_secrets.outputs.has_secrets == 'true'
        run: npm run test:auth-hijack-audit

  # ─────────────────────────────────────────────
  # 3) Production deploy — security-db success 필수
  # ENABLE_VERCEL_DEPLOY + ENABLE_SECURITY_AUDIT 모두 true
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy (Vercel Production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, build-e2e, security-db]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_VERCEL_DEPLOY == 'true' &&
      vars.ENABLE_SECURITY_AUDIT == 'true'
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

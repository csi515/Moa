# Moa Academy — CI/CD
# Node.js 22 (.nvmrc / package.json engines) · Vite · React · TypeScript · npm
# 트리거: main push, pull_request
#
# Dependency (quality 실패 시 하위 job은 skip — 의도):
#   quality (lint + unit + static security)
#     ├─ build-e2e
#     └─ security-db   (ENABLE_SECURITY_AUDIT=true — real RLS/auth DB audits)
#   deploy ← needs quality + build-e2e + security-db
#            (main + ENABLE_VERCEL_DEPLOY + ENABLE_SECURITY_AUDIT)
#            security-db 실패/누락 secret(main) → deploy 차단
#
# Security layers:
#   1) Static (secrets 불필요) — quality job에서 실제 실행, 실패 시 CI FAIL
#   2) DB audits (Supabase JWT/시드) — security-db, continue-on-error 없음
#      PR + secret 없음: 감사 미실행 (job 성공 ≠ DB audit PASS)
#      main push + secret 없음: security-db FAIL → deploy 불가
#   3) Production gate — deploy는 security-db success 필수
#
# 비밀값은 절대 워크플로우에 하드코딩하지 않습니다.
# GitHub → Settings → Secrets and variables → Actions

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────
  # 1) 품질 + Static security (비밀값 불필요)
  # ─────────────────────────────────────────────
  quality:
    name: Lint & Unit & Static Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      # ── 도메인 unit ──────────────────────────────────────────────
      - name: Unit — bulk-import
        run: npm run test:bulk-import

      - name: Unit — deeplink
        run: npm run test:deeplink

      - name: Unit — finance suite
        run: npm run test:finance

      - name: Unit — timetable-placement
        run: npm run test:timetable-placement

      - name: Unit — today-lesson-teacher
        run: npm run test:today-lesson-teacher

      - name: Unit — manual-attendance-class
        run: npm run test:manual-attendance-class

      # commerce suite 1회 (DB 없으면 dry-run/정적 — secrets 불필요)
      - name: Unit — commerce suite
        run: npm run test:commerce-unit

      - name: Unit — sale-return-points
        run: npm run test:sale-return-points

      - name: Unit — textbook-core-sale-link
        run: npm run test:textbook-core-sale-link

      - name: Unit — skin-retail-migrate
        run: npm run test:skin-retail-migrate

      # ── Static security (secrets 불필요, 실패 시 CI FAIL) ────────
      - name: Static security — rls-membership-policy
        run: npm run test:rls-membership-policy

      - name: Static security — rls-member-scope-harden
        run: npm run test:rls-member-scope-harden

      - name: Static security — session-pass-org-integrity
        run: npm run test:session-pass-org-integrity

      - name: Static security — booking-pass-atomic-contract
        run: npm run test:booking-pass-atomic-contract

      - name: Static security — persist-policy
        run: npm run test:persist-policy

      - name: Unit — persist-schedules
        run: npm run test:persist-schedules

      - name: Unit — attendance-pass-atomic
        run: npm run test:attendance-pass-atomic

      - name: Unit — attendance-class-key
        run: npm run test:attendance-class-key

      - name: Unit — attendance-features
        run: npm run test:attendance-features

      - name: Unit — absence-notify
        run: npm run test:absence-notify

      - name: Unit — makeup-schedule-atomic
        run: npm run test:makeup-schedule-atomic

      - name: Unit — local-date
        run: npm run test:local-date

      - name: Unit — consultation-today
        run: npm run test:consultation-today

      - name: Unit — piano-expected-attendance
        run: npm run test:piano-expected-attendance

      - name: Unit — lesson-homework-sync
        run: npm run test:lesson-homework-sync

      - name: Unit — pending-mutations
        run: npm run test:pending-mutations

      - name: Unit — sync-persist-helpers
        run: npm run test:sync-persist-helpers

      - name: Unit — commerce barrel
        run: npm run test:commerce-barrel

      - name: Unit — commerce revenue
        run: npm run test:commerce-revenue

      - name: Unit — commerce store capability
        run: npm run test:commerce-store-capability

      - name: Unit — retail revenue facade
        run: npm run test:retail-revenue

      - name: Static security — retail-staff-sale-perm
        run: npm run test:retail-staff-sale-perm

      - name: Static security — permissions-invariant
        run: npm run test:permissions-invariant

      - name: Static security — authorization foundation
        run: npm run test:authorization

      - name: Static security — org-access-invariant
        run: npm run test:org-access-invariant

  # ─────────────────────────────────────────────
  # 빌드 + Playwright E2E
  # ─────────────────────────────────────────────
  build-e2e:
    name: Build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
      VITE_APP_SHORT_NAME: ${{ vars.VITE_APP_SHORT_NAME }}
      VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
      VITE_LEGAL_ENTITY_NAME: ${{ vars.VITE_LEGAL_ENTITY_NAME }}
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required build secrets
        run: |
          missing=0
          for key in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_APP_URL; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Register secrets in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Required VITE_* secrets are present (values not logged)."

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ORG_NAME: ${{ secrets.E2E_ORG_NAME }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 2) DB security audits (Supabase 연결·JWT 시드)
  # Repository variable ENABLE_SECURITY_AUDIT=true 일 때 실행
  # continue-on-error 없음 — 실패 시 job FAIL → merge/deploy 차단
  # PR에서 audit secrets 없으면 스킵(정적 보안은 quality에서 이미 통과)
  # main push에서는 secrets 필수 (배포 게이트)
  # ─────────────────────────────────────────────
  security-db:
    name: Security DB Audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    if: vars.ENABLE_SECURITY_AUDIT == 'true'
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      RLS_AUDIT_ORG_A_ID: ${{ secrets.RLS_AUDIT_ORG_A_ID }}
      RLS_AUDIT_ORG_B_ID: ${{ secrets.RLS_AUDIT_ORG_B_ID }}
      RLS_AUDIT_STAFF_A_JWT: ${{ secrets.RLS_AUDIT_STAFF_A_JWT }}
      RLS_AUDIT_OWNER_A_JWT: ${{ secrets.RLS_AUDIT_OWNER_A_JWT }}
      RLS_AUDIT_PARENT_JWT: ${{ secrets.RLS_AUDIT_PARENT_JWT }}
      RLS_AUDIT_ATTACKER_JWT: ${{ secrets.RLS_AUDIT_ATTACKER_JWT }}
      RLS_AUDIT_CUSTOMER_JWT: ${{ secrets.RLS_AUDIT_CUSTOMER_JWT }}
      RLS_AUDIT_FOREIGN_CUSTOMER_ID: ${{ secrets.RLS_AUDIT_FOREIGN_CUSTOMER_ID }}
      RLS_AUDIT_STAFF_USER_ID: ${{ secrets.RLS_AUDIT_STAFF_USER_ID }}
      AUTH_HIJACK_USER_B_JWT: ${{ secrets.AUTH_HIJACK_USER_B_JWT }}
      AUTH_HIJACK_PROVIDER_USER_ID: ${{ secrets.AUTH_HIJACK_PROVIDER_USER_ID }}
      AUTH_HIJACK_USER_A_ID: ${{ secrets.AUTH_HIJACK_USER_A_ID }}
      AUTH_HIJACK_PROVIDER: ${{ secrets.AUTH_HIJACK_PROVIDER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect DB audit secrets
        id: audit_secrets
        run: |
          # 값은 출력하지 않음 — 존재 여부만
          required_ok=1
          for key in \
            VITE_SUPABASE_URL \
            VITE_SUPABASE_ANON_KEY \
            RLS_AUDIT_ORG_A_ID \
            RLS_AUDIT_ORG_B_ID \
            RLS_AUDIT_STAFF_A_JWT \
            RLS_AUDIT_OWNER_A_JWT \
            RLS_AUDIT_PARENT_JWT
          do
            if [ -z "${!key}" ]; then
              echo "missing_name=$key"
              required_ok=0
            fi
          done
          # membership escalation: attacker JWT (전용 또는 staff JWT 재사용)
          if [ -z "$RLS_AUDIT_ATTACKER_JWT" ] && [ -z "$RLS_AUDIT_STAFF_A_JWT" ]; then
            echo "missing_name=RLS_AUDIT_ATTACKER_JWT_or_STAFF_A_JWT"
            required_ok=0
          fi
          # auth hijack
          for key in AUTH_HIJACK_USER_B_JWT AUTH_HIJACK_PROVIDER_USER_ID; do
            if [ -z "${!key}" ]; then
              echo "missing_name=$key"
              required_ok=0
            fi
          done
          if [ "$required_ok" -eq 1 ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "DB audit secrets are present (values not logged)."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "One or more DB audit secrets are unset."
          fi

      - name: Require secrets on main (deploy gate)
        if: >
          steps.audit_secrets.outputs.has_secrets != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          echo "::error::ENABLE_SECURITY_AUDIT=true on main but DB audit secrets are missing."
          echo "Configure RLS_AUDIT_* and AUTH_HIJACK_* in Actions secrets (do not commit values)."
          exit 1

      - name: Skip DB audits on PR without secrets
        if: >
          steps.audit_secrets.outputs.has_secrets != 'true' &&
          !(github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          echo "DB security audits were not executed (secrets unavailable on this PR)."
          echo "This job success is not a DB-audit PASS."
          echo "Static security already ran in quality. main push fails if secrets are missing."

      - name: RLS org isolation audit
        if: steps.audit_secrets.outputs.has_secrets == 'true'
        run: npm run test:rls-audit

      - name: Atomic booking + session pass DB IT
        if: steps.audit_secrets.outputs.has_secrets == 'true'
        run: npm run test:booking-pass-atomic-db

      - name: Membership escalation audit
        if: steps.audit_secrets.outputs.has_secrets == 'true'
        run: npm run test:rls-membership-escalation

      - name: Auth providers hijack audit
        if: steps.audit_secrets.outputs.has_secrets == 'true'
        run: npm run test:auth-hijack-audit

  # ─────────────────────────────────────────────
  # 3) Production deploy — security-db success 필수
  # ENABLE_VERCEL_DEPLOY + ENABLE_SECURITY_AUDIT 모두 true
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy (Vercel Production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, build-e2e, security-db]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_VERCEL_DEPLOY == 'true' &&
      vars.ENABLE_SECURITY_AUDIT == 'true'
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

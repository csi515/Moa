<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pianoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#pianoGrad)" />
  <!-- Piano Base -->
  <g transform="translate(96, 120)">
    <rect x="0" y="40" width="320" height="220" rx="16" fill="#ffffff" stroke="#e0e7ff" stroke-width="4" />
    <!-- White Keys Separators -->
    <line x1="45.7" y1="40" x2="45.7" y2="256" stroke="#cbd5e1" stroke-width="3" />
    <line x1="91.4" y1="40" x2="91.4" y2="256" stroke="#cbd5e1" stroke-width="3" />
    <line x1="137.1" y1="40" x2="137.1" y2="256" stroke="#cbd5e1" stroke-width="3" />
    <line x1="182.8" y1="40" x2="182.8" y2="256" stroke="#cbd5e1" stroke-width="3" />
    <line x1="228.5" y1="40" x2="228.5" y2="256" stroke="#cbd5e1" stroke-width="3" />
    <line x1="274.2" y1="40" x2="274.2" y2="256" stroke="#cbd5e1" stroke-width="3" />
    <!-- Black Keys -->
    <rect x="30" y="40" width="28" height="130" rx="5" fill="#0f172a" />
    <rect x="76" y="40" width="28" height="130" rx="5" fill="#0f172a" />
    <rect x="168" y="40" width="28" height="130" rx="5" fill="#0f172a" />
    <rect x="214" y="40" width="28" height="130" rx="5" fill="#0f172a" />
    <rect x="260" y="40" width="28" height="130" rx="5" fill="#0f172a" />
    <!-- Musical Note Accent -->
    <path d="M 270 10 L 270 -40 L 310 -30 L 310 0" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="258" cy="12" r="14" fill="#f59e0b"/>
  </g>
</svg>

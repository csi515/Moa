<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="moaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#moaGrad)" />
  
  <!-- Geometric "M" mark representing Moa (모아) -->
  <g transform="translate(256, 256)">
    <!-- Three stacked rounded rectangles forming abstract "모아" / building blocks -->
    <!-- Bottom block - widest (represents foundation/academy base) -->
    <rect x="-120" y="50" width="240" height="56" rx="12" fill="#ffffff" opacity="0.95" />
    
    <!-- Middle block - medium width -->
    <rect x="-100" y="-18" width="200" height="56" rx="12" fill="#ffffff" opacity="0.95" />
    
    <!-- Top block - narrowest (pyramid/growth concept) -->
    <rect x="-80" y="-86" width="160" height="56" rx="12" fill="#ffffff" opacity="0.95" />
    
    <!-- Accent dots (representing students/community) -->
    <circle cx="-60" cy="78" r="8" fill="#fbbf24" />
    <circle cx="0" cy="10" r="8" fill="#fbbf24" />
    <circle cx="40" cy="-58" r="8" fill="#fbbf24" />
  </g>
</svg>
